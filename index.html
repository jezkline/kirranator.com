<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kirranator</title>
<meta name="description" content="kirranator">
<meta name="theme-color" content="#84c59d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,112,900&display=swap&text=kirnato" rel="stylesheet">
<style>
  :root { --bg: #84c59d; --fg: #ffffff; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    display: grid;
    place-items: center;
    min-height: 100svh;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: inherit;
    text-decoration: none;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-style: italic;
    font-weight: 900;
    font-stretch: 112%;
    font-size: clamp(2.6rem, 12.5vw, 11rem);
    letter-spacing: -0.035em;
    line-height: 1;
    padding: 0.1em 0.12em 0.14em 0.04em;
    transition: transform .25s ease;
  }
  a:hover { transform: translateY(-3px); }
  a:focus-visible { outline: 4px solid var(--fg); outline-offset: 8px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
</style>
</head>
<body>
  <a href="mailto:contact@kirranator.com" aria-label="kirranator — email contact@kirranator.com">kirranator</a>
</body>
</html>
