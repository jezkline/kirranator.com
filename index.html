<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kirranator</title>
<meta name="description" content="kirranator">
<meta name="theme-color" content="#84c59d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="soopafresh.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Soopafresh"; src: url("soopafresh.woff2") format("woff2"); font-display: block; }
  :root { --bg: #84c59d; --fg: #ffffff; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    display: grid;
    place-items: center;
    min-height: 100svh;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: inherit;
    text-decoration: none;
    font-family: "Soopafresh", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 17vw, 14rem);
    line-height: 1;
    padding: 0.1em;
    transition: transform .25s ease;
  }
  a:hover { transform: translateY(-3px); }
  a:focus-visible { outline: 4px solid var(--fg); outline-offset: 8px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
</style>
</head>
<body>
  <a href="mailto:contact@kirranator.com" aria-label="kirranator — email contact@kirranator.com">kirranator</a>
</body>
</html>
